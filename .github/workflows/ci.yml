name: Stone Memory CI

run-name: "${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.action) || github.event_name == 'workflow_dispatch' && format('PR #{0} · Backfill CI', inputs.pr_number) || github.event_name == 'push' && 'Backfill all open PRs' || 'Stone Memory CI' }}"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test against current main
        required: true
        type: string

concurrency:
  group: stone-memory-ci-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

jobs:
  resolve_pr:
    name: Resolve PR merge target
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      ci_sha: ${{ steps.resolve.outputs.ci_sha }}

    steps:
      - name: Check out current main for merge validation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          path: merge-check

      - name: Resolve pull request against current main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$EVENT_PR_NUMBER"
          else
            pr_number="$INPUT_PR_NUMBER"
          fi

          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A valid pull request number is required; received '$pr_number'."
            exit 1
          fi

          if ! pr_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/pulls/${pr_number}")"; then
            echo "::error::Unable to read pull request #${pr_number} from the GitHub API."
            exit 1
          fi

          state="$(jq -r '.state // empty' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          ci_sha="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          base_sha="$ci_sha"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_title="$EVENT_PR_TITLE"
            pr_url="$EVENT_PR_URL"
          else
            pr_title="$(jq -r '.title // empty' <<< "$pr_json")"
            pr_url="$(jq -r '.html_url // empty' <<< "$pr_json")"
          fi
          pr_title="${pr_title//$'\r'/ }"
          pr_title="${pr_title//$'\n'/ }"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="Backfill CI"
          else
            mode="Pull Request CI"
          fi

          if [[ "$state" != "open" ]]; then
            echo "::error::Pull request #${pr_number} is not open (state: ${state:-unknown}); refusing to test main."
            exit 1
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "::error::Pull request #${pr_number} targets '${base_ref:-unknown}', not main; refusing to test main."
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ || ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Pull request #${pr_number} did not return usable current-main/head SHAs; refusing to test main."
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
          git -C merge-check fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/ci-main" \
            "refs/pull/${pr_number}/head:refs/remotes/origin/ci-pr-${pr_number}"
          git -C merge-check checkout --detach "$base_sha"
          if ! git -C merge-check \
            -c user.name='Stone Memory CI' \
            -c user.email='ci@stone-memory.invalid' \
            merge --no-commit --no-ff "$head_sha"; then
            git -C merge-check merge --abort || true
            echo "::error::Pull request #${pr_number} cannot be merged with current main (${base_sha:0:7}); refusing to test main."
            exit 1
          fi
          merge_tree_sha="$(git -C merge-check write-tree)"

          {
            echo "# Stone Memory CI"
            echo
            if [[ -n "$pr_url" ]]; then
              echo "PR [#${pr_number}](${pr_url}) — ${pr_title}"
            else
              echo "PR #${pr_number} — ${pr_title}"
            fi
            echo
            echo "Mode:"
            echo "- ${mode}"
            echo
            echo "Base:"
            echo "${base_ref:-unknown} (${base_sha:0:7})"
            echo
            echo "Head:"
            echo "${head_sha:0:7}"
            echo
            echo "Merge target:"
            echo "current main ${base_sha:0:7} + PR head ${head_sha:0:7} (tree ${merge_tree_sha:0:7})"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "ci_sha=$ci_sha"
            echo "pr_title=$pr_title"
            echo "pr_url=$pr_url"
          } >> "$GITHUB_OUTPUT"

  backfill:
    name: Dispatch CI for open main PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: write

    steps:
      - name: Enumerate and dispatch every open main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! pr_numbers="$(gh api --paginate \
            --header 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[].number')"; then
            echo "::error::Unable to enumerate open pull requests targeting main."
            exit 1
          fi

          dispatched=0
          failed=0
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            echo "Dispatching Stone Memory CI for PR #${pr_number}"
            if gh workflow run ci.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field "pr_number=${pr_number}"; then
              ((dispatched += 1))
            else
              echo "::error::Failed to dispatch Stone Memory CI for PR #${pr_number}; continuing."
              ((failed += 1))
            fi
          done <<< "$pr_numbers"

          echo "Dispatched ${dispatched} PR(s); ${failed} dispatch(es) failed."
          if (( failed > 0 )); then
            exit 1
          fi

  test:
    name: Test / ${{ matrix.name }} / Node ${{ matrix.node }}
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            node: 22.x
          - name: Ubuntu
            os: ubuntu-latest
            node: 25.x
          - name: Windows
            os: windows-latest
            node: 22.x
          - name: Windows
            os: windows-latest
            node: 25.x
          - name: macOS
            os: macos-latest
            node: 22.x
          - name: macOS
            os: macos-latest
            node: 25.x

    steps:
      - name: Check out current main as test base
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.base_sha }}
          fetch-depth: 0
          path: pr-worktree

      - name: Check out current CI infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.ci_sha }}
          path: ci-tools
          fetch-depth: 1

      - name: Merge pull request into current main
        working-directory: pr-worktree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          if ! git \
            -c user.name='Stone Memory CI' \
            -c user.email='ci@stone-memory.invalid' \
            merge --no-commit --no-ff "$HEAD_SHA"; then
            git merge --abort || true
            echo "::error::Pull request #${PR_NUMBER} cannot be merged into current main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pr-worktree/package-lock.json

      - name: Install dependencies
        working-directory: pr-worktree
        run: npm ci

      - name: Run test suite with failure summary
        # The helper invokes the unchanged npm test script and preserves its exit code.
        working-directory: pr-worktree
        run: node ../ci-tools/.github/ci-test-reporter.mjs

      - name: Audit developer modules
        working-directory: pr-worktree
        run: npm run audit:developer-modules

      - name: Run supervisor cross-platform regression suite
        working-directory: pr-worktree
        run: npm run test:supervisor

      - name: Smoke test the CLI
        working-directory: pr-worktree
        run: node bin/stmem --help

  repository-checks:
    name: Repository Checks
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.head_sha }}

      - name: Fetch current main for diff check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.resolve_pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
          git fetch --no-tags origin "$BASE_SHA"

      - name: Check pull request diff whitespace
        env:
          BASE_SHA: ${{ needs.resolve_pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve_pr.outputs.head_sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA...$HEAD_SHA"

  package-smoke:
    name: Package Smoke
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out current main as package test base
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.base_sha }}
          fetch-depth: 0
          path: pr-worktree

      - name: Check out current CI infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.ci_sha }}
          path: ci-tools
          fetch-depth: 1

      - name: Merge pull request into current main
        working-directory: pr-worktree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}" \
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          if ! git \
            -c user.name='Stone Memory CI' \
            -c user.email='ci@stone-memory.invalid' \
            merge --no-commit --no-ff "$HEAD_SHA"; then
            git merge --abort || true
            echo "::error::Pull request #${PR_NUMBER} cannot be merged into current main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pr-worktree/package-lock.json

      - name: Install dependencies
        working-directory: pr-worktree
        run: npm ci

      - name: Pack the npm artifact
        env:
          PACKAGE_DIR: ${{ runner.temp }}/stone-memory-package
          PACK_METADATA: ${{ runner.temp }}/stone-memory-pack.json
        working-directory: pr-worktree
        run: |
          node -e "require('node:fs').mkdirSync(process.env.PACKAGE_DIR, { recursive: true })"
          npm pack --json --pack-destination "$PACKAGE_DIR" > "$PACK_METADATA"

      - name: Install and invoke the packed CLI
        env:
          PACKAGE_DIR: ${{ runner.temp }}/stone-memory-package
          PACK_METADATA: ${{ runner.temp }}/stone-memory-pack.json
          INSTALL_DIR: ${{ runner.temp }}/stone-memory-package-install
        run: |
          package_file="$(node -e 'const fs = require("node:fs"); const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(metadata[0].filename);' "$PACK_METADATA")"
          mkdir -p "$INSTALL_DIR"
          npm install --prefix "$INSTALL_DIR" --no-audit --no-fund "$PACKAGE_DIR/$package_file"
          "$INSTALL_DIR/node_modules/.bin/stmem" --help
