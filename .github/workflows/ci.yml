name: Stone Memory CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test against its generated merge ref
        required: true
        type: string

concurrency:
  group: stone-memory-ci-pr-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.x

jobs:
  resolve_pr:
    name: Resolve PR merge target
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      merge_ref: ${{ steps.resolve.outputs.merge_ref }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}

    steps:
      - name: Resolve pull request and merge ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="$EVENT_PR_NUMBER"
          else
            pr_number="$INPUT_PR_NUMBER"
          fi

          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A valid pull request number is required; received '$pr_number'."
            exit 1
          fi

          pr_json=""
          mergeable="unknown"
          for attempt in 1 2 3 4 5 6; do
            if ! pr_json="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/pulls/${pr_number}")"; then
              echo "::error::Unable to read pull request #${pr_number} from the GitHub API."
              exit 1
            fi

            mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable | tostring) end' <<< "$pr_json")"
            if [[ "$mergeable" != "unknown" ]]; then
              break
            fi
            if (( attempt < 6 )); then
              sleep 5
            fi
          done

          state="$(jq -r '.state // empty' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref // empty' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          mergeable_state="$(jq -r '.mergeable_state // empty' <<< "$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "::error::Pull request #${pr_number} is not open (state: ${state:-unknown}); refusing to test main."
            exit 1
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "::error::Pull request #${pr_number} targets '${base_ref:-unknown}', not main; refusing to test main."
            exit 1
          fi
          if [[ "$mergeable" != "true" || "$mergeable_state" == "dirty" ]]; then
            echo "::error::Pull request #${pr_number} cannot be tested as a merge result (mergeable=${mergeable}, state=${mergeable_state:-unknown})."
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ || ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Pull request #${pr_number} did not return usable base/head SHAs; refusing to test main."
            exit 1
          fi

          merge_ref="refs/pull/${pr_number}/merge"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pr_json")"
          if [[ ! "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GitHub did not provide ${merge_ref} (merge_commit_sha); merge-result testing is unavailable."
            exit 1
          fi

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "merge_ref=$merge_ref"
            echo "merge_sha=$merge_sha"
          } >> "$GITHUB_OUTPUT"

  backfill:
    name: Dispatch CI for open main PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: write

    steps:
      - name: Enumerate and dispatch every open main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! pr_numbers="$(gh api --paginate \
            --header 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[].number')"; then
            echo "::error::Unable to enumerate open pull requests targeting main."
            exit 1
          fi

          dispatched=0
          failed=0
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            echo "Dispatching Stone Memory CI for PR #${pr_number}"
            if gh workflow run ci.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              --field "pr_number=${pr_number}"; then
              ((dispatched += 1))
            else
              echo "::error::Failed to dispatch Stone Memory CI for PR #${pr_number}; continuing."
              ((failed += 1))
            fi
          done <<< "$pr_numbers"

          echo "Dispatched ${dispatched} PR(s); ${failed} dispatch(es) failed."
          if (( failed > 0 )); then
            exit 1
          fi

  test:
    name: Test / ${{ matrix.name }}
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.merge_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Smoke test the CLI
        run: node bin/stmem --help

  repository-checks:
    name: Repository Checks
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.head_sha }}

      - name: Check pull request diff whitespace
        env:
          BASE_SHA: ${{ needs.resolve_pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve_pr.outputs.head_sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA...$HEAD_SHA"

  package-smoke:
    name: Package Smoke
    if: >-
      needs.resolve_pr.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:backfill' ||
      github.event.label.name == 'ci:run')
    needs: resolve_pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.merge_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack the npm artifact
        env:
          PACKAGE_DIR: ${{ runner.temp }}/stone-memory-package
          PACK_METADATA: ${{ runner.temp }}/stone-memory-pack.json
        run: |
          node -e "require('node:fs').mkdirSync(process.env.PACKAGE_DIR, { recursive: true })"
          npm pack --json --pack-destination "$PACKAGE_DIR" > "$PACK_METADATA"

      - name: Install and invoke the packed CLI
        env:
          PACKAGE_DIR: ${{ runner.temp }}/stone-memory-package
          PACK_METADATA: ${{ runner.temp }}/stone-memory-pack.json
          INSTALL_DIR: ${{ runner.temp }}/stone-memory-package-install
        run: |
          package_file="$(node -e 'const fs = require("node:fs"); const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(metadata[0].filename);' "$PACK_METADATA")"
          mkdir -p "$INSTALL_DIR"
          npm install --prefix "$INSTALL_DIR" --no-audit --no-fund "$PACKAGE_DIR/$package_file"
          "$INSTALL_DIR/node_modules/.bin/stmem" --help
